name: Android CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :fm-dx-app:testDebugUnitTest
      - name: Android Lint
        run: ./gradlew :fm-dx-app:lintDebug
      - name: Markdown lint
        run: npx --yes markdownlint-cli2
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            android/fm-dx-app/build/reports/tests/testDebugUnitTest/
            android/fm-dx-app/build/reports/lint-results-debug.html
          retention-days: 14

  build_debug:
    needs: validate
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Capture version info
        id: version
        run: |
          info=$(./gradlew -q :fm-dx-app:printVersion)
          echo "$info"
          {
            echo "name=$(echo "$info" | awk -F= '/VERSION_NAME/ {print $2}')"
            echo "code=$(echo "$info" | awk -F= '/VERSION_CODE/ {print $2}')"
          } >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: ./gradlew :fm-dx-app:assembleDebug
      - name: Rename debug APK with version
        run: |
          mv android/fm-dx-app/build/outputs/apk/debug/fm-dx-app-debug.apk \
             "android/fm-dx-app/build/outputs/apk/debug/fm-dx-app-debug-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fm-dx-app-debug-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: android/fm-dx-app/build/outputs/apk/debug/fm-dx-app-debug-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk
          retention-days: 30

  build_release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Capture version info
        id: version
        run: |
          info=$(./gradlew -q :fm-dx-app:printVersion)
          echo "$info"
          {
            echo "name=$(echo "$info" | awk -F= '/VERSION_NAME/ {print $2}')"
            echo "code=$(echo "$info" | awk -F= '/VERSION_CODE/ {print $2}')"
          } >> "$GITHUB_OUTPUT"
      - name: Build release APK
        run: ./gradlew :fm-dx-app:assembleRelease
      - name: Rename release APK with version
        run: |
          mv android/fm-dx-app/build/outputs/apk/release/fm-dx-app-release.apk \
             "android/fm-dx-app/build/outputs/apk/release/fm-dx-app-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fm-dx-app-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: android/fm-dx-app/build/outputs/apk/release/fm-dx-app-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk
          retention-days: 30
