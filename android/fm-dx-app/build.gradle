plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.gitlab.arturbosch.detekt'
}

// Git-derived version. versionCode = total commit count (monotonic across the branch),
// versionName = `git describe --tags --always --dirty`, with the leading `v` stripped.
// To cut a release: `git tag v2.0 && git push --tags`. Builds outside a git checkout
// (e.g. a Docker COPY of just the source tree) fall back to the constants below.
// `providers.exec` is configuration-cache-compatible (unlike raw ProcessBuilder).
def runGit = { String... args ->
    def result = providers.exec {
        commandLine(['git', *args])
        workingDir = rootDir
        ignoreExitValue = true
    }
    if (result.result.get().exitValue != 0) return null
    def text = result.standardOutput.asText.get().trim()
    text.isEmpty() ? null : text
}
def FALLBACK_VERSION_CODE = 20000
def FALLBACK_VERSION_NAME = "2.0.0"
def resolvedVersionCode = runGit('rev-list', '--count', 'HEAD')?.toInteger() ?: FALLBACK_VERSION_CODE
def resolvedVersionName = runGit('describe', '--tags', '--always', '--dirty')
    ?.replaceFirst(/^v/, '') ?: FALLBACK_VERSION_NAME

android {
    namespace = 'org.fmdx.app'
    compileSdk 37

    defaultConfig {
        applicationId = 'org.fmdx.app'
        minSdk = 29
        targetSdk = 37
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName

        def userAgent = "FM-DX-App/$versionName"
        buildConfigField "String", "USER_AGENT", "\"${userAgent}\""
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        // Fail the build on lint errors; keep warnings visible but non-fatal.
        abortOnError = true
        warningsAsErrors = false
        checkDependencies = true
        // These connect to the network / are advisory only — too flaky for CI.
        disable += ['NewerVersionAvailable', 'GradleDependency']
        // Stable, reviewable report locations.
        textReport = true
        htmlReport = true
        baseline = file('lint-baseline.xml')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui:1.11.0'
    implementation 'androidx.compose.ui:ui-graphics:1.11.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.0'

    implementation 'androidx.compose.foundation:foundation:1.11.0'
    implementation 'com.seo4d696b75.compose:material3-picker:0.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.4.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.mikepenz:multiplatform-markdown-renderer-android:0.40.2'
    implementation 'com.mikepenz:multiplatform-markdown-renderer-m3:0.40.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-extractor:1.10.0'
    implementation 'androidx.media3:media3-session:1.10.0'

    // CDC-ACM serial driver for a directly attached USB FM-DX Tuner.
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20251224'

    // detekt static analysis: ktlint formatting rules + Jetpack Compose rules.
    detektPlugins 'io.gitlab.arturbosch.detekt:detekt-formatting:1.23.8'
    detektPlugins 'io.nlopez.compose.rules:detekt:0.6.2'
}

detekt {
    parallel = true
    buildUponDefaultConfig = true
    config.setFrom("$rootDir/config/detekt/detekt.yml")
    baseline = file('detekt-baseline.xml')
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = '21'
    reports {
        html.required = true
        sarif.required = false
        md.required = false
    }
}

tasks.register("printVersion") {
    def versionName = android.defaultConfig.versionName
    def versionCode = android.defaultConfig.versionCode
    doLast {
        println("VERSION_NAME=${versionName}")
        println("VERSION_CODE=${versionCode}")
    }
}
